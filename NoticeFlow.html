<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NoticeFlow</title>
<style>
  :root {
    --bg: #FAFAF7;
    --surface: #FFFFFF;
    --ink: #1C1C1A;
    --ink-soft: #6B6A64;
    --line: #E4E2DC;
    --accent: #B4472B;
    --urgent: #C0392B;
    --soon: #B7791F;
    --safe: #3F7A5C;
    --cat-academic: #3B5BA5;
    --cat-event: #3F7A5C;
    --cat-lost: #B7791F;
    --cat-general: #6B6A64;
    --radius: 10px;
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --bg: #171613;
      --surface: #201F1B;
      --ink: #F1EFE9;
      --ink-soft: #9C9A92;
      --line: #34322C;
    }
  }
  :root[data-theme="dark"] {
    --bg: #171613;
    --surface: #201F1B;
    --ink: #F1EFE9;
    --ink-soft: #9C9A92;
    --line: #34322C;
  }
  * { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    min-height: 100%;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 28px 20px 60px; }
  header { margin-bottom: 22px; }
  .brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -0.01em; }
  .tag-count { font-size: 13px; color: var(--ink-soft); white-space: nowrap; }
  .sub { color: var(--ink-soft); font-size: 14px; margin-top: 4px; max-width: 46ch; line-height: 1.5; }

  .tabs { display: flex; gap: 6px; margin-top: 20px; border-bottom: 1px solid var(--line); }
  .tab {
    background: none; border: none; font-size: 14px; color: var(--ink-soft);
    padding: 10px 4px; margin-right: 18px; cursor: pointer; border-bottom: 2px solid transparent;
    font-family: inherit;
  }
  .tab.active { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }

  .view { margin-top: 18px; }
  .view[hidden] { display: none; }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 12px;
  }
  .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .card-title { font-size: 15.5px; font-weight: 600; line-height: 1.35; }
  .cat {
    font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 100px;
    white-space: nowrap; flex-shrink: 0; color: #fff;
  }
  .cat-academic { background: var(--cat-academic); }
  .cat-event { background: var(--cat-event); }
  .cat-lost { background: var(--cat-lost); }
  .cat-general { background: var(--cat-general); }

  .card-note { font-size: 13.5px; color: var(--ink-soft); margin-top: 6px; line-height: 1.5; }
  .card-meta { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; }
  .expiry { font-size: 12.5px; font-weight: 600; }
  .expiry.urgent { color: var(--urgent); }
  .expiry.soon { color: var(--soon); }
  .expiry.safe { color: var(--safe); }
  .posted { font-size: 12px; color: var(--ink-soft); }

  .share-btn {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 12.5px; color: var(--ink-soft); background: none;
    border: 1px solid var(--line); border-radius: 100px; padding: 5px 10px;
    cursor: pointer; font-family: inherit; text-decoration: none;
  }
  .share-btn:hover { border-color: var(--accent); color: var(--accent); }

  .empty { color: var(--ink-soft); font-size: 14px; padding: 30px 4px; text-align: center; }

  .archive-toggle {
    background: none; border: none; color: var(--ink-soft); font-size: 13px;
    text-decoration: underline; cursor: pointer; padding: 14px 0 0; font-family: inherit;
  }

  form { display: flex; flex-direction: column; gap: 14px; }
  .form-head { display: flex; justify-content: space-between; align-items: center; }
  .form-head h2 { font-size: 16px; margin: 0; }
  label { font-size: 13px; font-weight: 600; color: var(--ink-soft); display: block; margin-bottom: 5px; }
  input, select, textarea {
    width: 100%; font-family: inherit; font-size: 14.5px; color: var(--ink);
    background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
    padding: 9px 10px;
  }
  textarea { resize: vertical; min-height: 56px; }
  .post-btn {
    background: var(--accent); color: #fff; border: none; border-radius: 8px;
    padding: 9px 16px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit;
  }
  .post-btn:hover { opacity: 0.9; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .toast {
    position: fixed; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); left: 50%;
    transform: translateX(-50%); background: var(--ink); color: var(--bg);
    padding: 10px 18px; border-radius: 100px; font-size: 13.5px; opacity: 0;
    pointer-events: none; transition: opacity 0.2s ease;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <h1>NoticeFlow</h1>
      <span class="tag-count" id="liveCount"></span>
    </div>
    <div class="sub">A live feed for the College of Science entrance board. Notices expire on purpose so the feed stays honest.</div>
    <div class="tabs">
      <button class="tab active" data-tab="feed">Feed</button>
      <button class="tab" data-tab="add">Add notice</button>
    </div>
  </header>

  <section class="view" id="feedView">
    <div id="feedList"></div>
    <div id="feedEmpty" class="empty" hidden>Nothing live right now. Everything on the board has expired.</div>
    <button class="archive-toggle" id="archiveToggle">Show expired (archive)</button>
    <div id="archiveList" hidden></div>
  </section>

  <section class="view" id="addView" hidden>
    <div class="card">
      <div class="form-head">
        <h2>Add notice</h2>
        <button class="post-btn" id="postBtn" form="noticeForm" type="submit">Post</button>
      </div>
      <form id="noticeForm">
        <div>
          <label for="fTitle">Title</label>
          <input id="fTitle" required placeholder="e.g. CSM 152 seminar, Fri 3pm">
        </div>
        <div class="row2">
          <div>
            <label for="fCategory">Category</label>
            <select id="fCategory">
              <option value="academic">Academic</option>
              <option value="event">Event</option>
              <option value="lost">Lost & found</option>
              <option value="general">General</option>
            </select>
          </div>
          <div>
            <label for="fExpiry">Expires on</label>
            <input id="fExpiry" type="date" required>
          </div>
        </div>
        <div>
          <label for="fNote">Short line</label>
          <textarea id="fNote" placeholder="One line, enough to act on without reading anything else"></textarea>
        </div>
      </form>
    </div>
  </section>
</div>
<div class="toast" id="toast"></div>

<script>
(function () {
  var STORAGE_KEY = "noticeflow_notices_v1";
  var CAT_LABEL = { academic: "Academic", event: "Event", lost: "Lost & found", general: "General" };

  var seed = [
    { id: "s1", title: "CSM 152 group assignment briefing", category: "academic",
      posted: daysAgo(1), expiry: daysFromNow(1),
      note: "Meet at the CS block seminar room, 4pm. Bring your group's proposal draft." },
    { id: "s2", title: "Lost: blue KNUST ID card", category: "lost",
      posted: daysAgo(2), expiry: daysFromNow(3),
      note: "Found near the entrance steps. Ask at the porters' lodge." },
    { id: "s3", title: "Science Students' Association general meeting", category: "event",
      posted: daysAgo(3), expiry: daysFromNow(6),
      note: "Thursday, 5:30pm, main auditorium. Attendance sheet at the door." },
    { id: "s4", title: "Hostel water schedule change", category: "general",
      posted: daysAgo(6), expiry: daysAgo(1),
      note: "Supply now runs 5am to 9am only, effective this week." }
  ];

  function daysAgo(n) { var d = new Date(); d.setDate(d.getDate() - n); return d.toISOString().slice(0,10); }
  function daysFromNow(n) { var d = new Date(); d.setDate(d.getDate() + n); return d.toISOString().slice(0,10); }
  function todayStr() { return new Date().toISOString().slice(0,10); }

  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return seed.slice();
      var parsed = JSON.parse(raw);
      return Array.isArray(parsed) ? parsed : seed.slice();
    } catch (e) { return seed.slice(); }
  }
  function save(notices) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(notices)); } catch (e) {}
  }

  var notices = load();

  function daysUntil(dateStr) {
    var today = new Date(todayStr());
    var target = new Date(dateStr);
    return Math.round((target - today) / 86400000);
  }
  function fmtDate(dateStr) {
    var d = new Date(dateStr + "T00:00:00");
    return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
  }
  function expiryLabel(dateStr) {
    var n = daysUntil(dateStr);
    if (n < 0) return { text: "Expired", cls: "urgent" };
    if (n === 0) return { text: "Expires today", cls: "urgent" };
    if (n === 1) return { text: "Expires tomorrow", cls: "urgent" };
    if (n <= 3) return { text: "Expires in " + n + " days", cls: "soon" };
    return { text: "Expires " + fmtDate(dateStr), cls: "safe" };
  }

  function renderList(el, list, emptyMsg) {
    el.innerHTML = "";
    if (list.length === 0) {
      var p = document.createElement("div");
      p.className = "empty";
      p.textContent = emptyMsg;
      el.appendChild(p);
      return;
    }
    list.forEach(function (n) {
      var exp = expiryLabel(n.expiry);
      var card = document.createElement("div");
      card.className = "card";
      var waText = encodeURIComponent(n.title + (n.note ? " — " + n.note : "") + " (via NoticeFlow)");
      card.innerHTML =
        '<div class="card-top">' +
          '<div class="card-title">' + escapeHtml(n.title) + '</div>' +
          '<span class="cat cat-' + n.category + '">' + CAT_LABEL[n.category] + '</span>' +
        '</div>' +
        (n.note ? '<div class="card-note">' + escapeHtml(n.note) + '</div>' : '') +
        '<div class="card-meta">' +
          '<span class="posted">Posted ' + fmtDate(n.posted) + '</span>' +
          '<span class="expiry ' + exp.cls + '">' + exp.text + '</span>' +
        '</div>' +
        '<div style="margin-top:10px">' +
          '<a class="share-btn" href="https://wa.me/?text=' + waText + '" target="_blank" rel="noopener noreferrer">Share to WhatsApp</a>' +
        '</div>';
      el.appendChild(card);
    });
  }

  function escapeHtml(s) {
    var div = document.createElement("div");
    div.textContent = s;
    return div.innerHTML;
  }

  function refresh() {
    var live = notices.filter(function (n) { return daysUntil(n.expiry) >= 0; })
      .sort(function (a, b) { return daysUntil(a.expiry) - daysUntil(b.expiry); });
    var expired = notices.filter(function (n) { return daysUntil(n.expiry) < 0; })
      .sort(function (a, b) { return daysUntil(b.expiry) - daysUntil(a.expiry); });

    renderList(document.getElementById("feedList"), live, "");
    document.getElementById("feedEmpty").hidden = live.length !== 0;
    renderList(document.getElementById("archiveList"), expired, "Nothing has expired yet.");
    document.getElementById("liveCount").textContent = live.length + " live";
  }

  var archiveOpen = false;
  document.getElementById("archiveToggle").addEventListener("click", function () {
    archiveOpen = !archiveOpen;
    document.getElementById("archiveList").hidden = !archiveOpen;
    this.textContent = archiveOpen ? "Hide expired" : "Show expired (archive)";
  });

  var tabs = document.querySelectorAll(".tab");
  tabs.forEach(function (t) {
    t.addEventListener("click", function () {
      tabs.forEach(function (o) { o.classList.remove("active"); });
      t.classList.add("active");
      document.getElementById("feedView").hidden = t.dataset.tab !== "feed";
      document.getElementById("addView").hidden = t.dataset.tab !== "add";
    });
  });

  document.getElementById("noticeForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var title = document.getElementById("fTitle").value.trim();
    var category = document.getElementById("fCategory").value;
    var expiry = document.getElementById("fExpiry").value;
    var note = document.getElementById("fNote").value.trim();
    if (!title || !expiry) return;
    notices.push({
      id: "n" + Date.now(),
      title: title, category: category, note: note,
      posted: todayStr(), expiry: expiry
    });
    save(notices);
    this.reset();
    showToast("Posted to the feed");
    tabs[0].click();
    refresh();
  });

  function showToast(msg) {
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(function () { t.classList.remove("show"); }, 1800);
  }

  refresh();
})();
</script>
</body>
</html>
